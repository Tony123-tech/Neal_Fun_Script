name: 🧪 CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Modern OS Compliant)
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Full Node 24 configuration to clear EOL warnings

      - name: 🛠️ Install Project Dependencies
        run: npm install  # Standard execution creates a clean workspace on the fly

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install chromium

      - name: 🚀 Run Tests
        run: npm test
