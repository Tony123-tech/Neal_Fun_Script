name: 🧪 CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    # Set to look inside your exact capitalized repository directory name
    defaults:
      run:
        working-directory: Iam_not_a_robot

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Modern OS Compliant)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🛠️ Install Project Dependencies
        run: npm install

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install chromium

      - name: 🚀 Run Tests
        run: npm test

