name: 🧪 CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Modern OS Compliant)
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Using Node 24 to adhere to active GitHub Action runner defaults
          cache: 'npm'     # Correctly targeting your npm architecture lock structure

      - name: 🛠️ Install Dependencies
        run: npm ci        # Clean install using package-lock.json

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install chromium

      - name: 🚀 Run Tests
        run: npm test
