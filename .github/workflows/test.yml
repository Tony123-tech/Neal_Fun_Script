name: 🧪 CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Modern OS Compliant)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🔍 Debug Directory Structure
        run: |
          echo "=== Root Directory Listing ==="
          ls -R

      # This step will run right after we see the directory paths above
      - name: 🛠️ Install Project Dependencies
        run: npm install
